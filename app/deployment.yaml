apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parser
  template:
    metadata:
      labels:
        app: parser
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: parser
          image: parser-service:v1
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_URI
              value: s3://models/v1
            - name: MODEL_VERSION
              value: v1
            - name: S3_ENDPOINT
              value: http://seaweedfs-s3.data.svc.cluster.local:8333
            - name: MAX_NEW_TOKENS
              value: "64"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
