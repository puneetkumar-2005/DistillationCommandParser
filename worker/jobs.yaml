# Two Jobs, one per shard. Each Job runs in namespace "pipeline"
# with a different SHARD_INDEX. Do not edit SHARD_COUNT here
# without also changing the other Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-shard-0
  namespace: pipeline
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: teacher-worker:task1
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              value: "0"
            - name: SHARD_COUNT
              value: "2"
            - name: S3_ENDPOINT
              value: "http://seaweedfs-s3.data.svc.cluster.local:8333"
            - name: S3_BUCKET
              value: "datasets"
            - name: OLLAMA_URL
              value: "http://host.k3d.internal:11434"
            - name: OLLAMA_MODEL
              value: "phi3.5"
            - name: PROMPT_PATH
              value: "/prompts/teacher_prompt.txt"
            - name: AWS_ACCESS_KEY_ID
              value: "local"
            - name: AWS_SECRET_ACCESS_KEY
              value: "local"
          volumeMounts:
            - name: prompt
              mountPath: /prompts
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: prompt
          configMap:
            name: teacher-prompt
---
